[general]
desktop = true # wallpaper, Desktop-folder icons, and right-click menus
gap = 8
outer_gap = 0
layout = "MasterStack"
taskbar = true
taskbar_height = 40
auto_tile = true
instant_first_layout = true
auto_float_utility_windows = true
respect_window_size_constraints = true
hide_native_taskbar = true
# Where notification-area icons come from.
#   auto     - host the notification area when AltDWM owns the taskbar (the case
#              above), mirror Explorer's tray when it does not
#   native   - always host it; icons arrive here instead of in Explorer's tray
#   explorer - always mirror Explorer's buttons over UI Automation (no icons,
#              only names)
#   off      - show nothing
tray = "auto"
launch_startup_apps = true # only runs when AltDWM is the configured Winlogon shell
filter_virtual_desktop = false
# Workspaces per monitor. `1` (the default) keeps the feature off; switching away
# from a workspace hides the windows on it. `alt-dwm --restore-windows` recovers
# them if AltDWM is ever killed outright while any are hidden.
workspaces = 1
# The master column's share of the usable width, 0.1-0.9. Adjustable at runtime
# with the `wider_master` and `narrower_master` actions.
master_ratio = 0.6

[ignore]
classes = [
    "Progman",
    "WorkerW",
    "Shell_TrayWnd",
    "Shell_SecondaryTrayWnd",
    "AltDWM_Taskbar",
    "AltDWM_Host",
]
titles = []
processes = []

[theme]
panel_bg = "#1e1e1e"
panel_bg_top = "#252526"
text = "#ffffff"
text_dim = "#aaaaaa"
accent = "#3a6ea5"
accent_active = "#007acc"
border = "#404040"
border_active = "#8b5cf6"
border_inactive = "#343842"
tray_bg = "#2d2d30"
surface = "#292b32"
surface_hover = "#353842"
font_name = "Segoe UI"
font_size = 13
font_weight = 400
strong_font_weight = 500
rounding = 12
gap = 8

[[panels]]
name = "shell"
position = "bottom"
height = 58
monitor = "all"
margin = [0, 8, 8, 8]
widgets = [
    "launcher",
    "workspaces",
    "layout",
    "window_list",
    "cpu",
    "system",
    "tray",
    "clock",
]

[[widgets]]
type = "launcher"
name = "launcher"
script = "scripts/widgets/launcher.rhai"
label = "AltDWM"
width = 120

[[widgets]]
type = "layout"
name = "layout"
script = "scripts/widgets/layout.rhai"
width = 216

[[widgets]]
type = "window_list"
name = "window_list"
script = "scripts/widgets/window_list.rhai"

[[widgets]]
type = "window_title"
name = "window_title"
script = "scripts/widgets/window_title.rhai"

[[widgets]]
type = "tray"
name = "tray"
script = "scripts/widgets/tray.rhai"
# Omit `width` and the tray sizes itself to its icons; set it to pin the bar's
# geometry. `max_items` caps how many reach the bar — the rest go to the
# overflow button.
# width = 180
# max_items = 3 # default

[[widgets]]
type = "system_status"
name = "system"
script = "scripts/widgets/system.rhai"
show_volume = true
show_network = true
show_battery = true
show_input = true

[[widgets]]
type = "clock"
name = "clock"
script = "scripts/widgets/clock.rhai"
format = "%H:%M"
interval = 1000
width = 136

[[widgets]]
type = "custom"
name = "cpu"
interval = 2000
script = "scripts/cpu.rhai"
width = 150

# match_class is exact; `*` opts into partial matching. Spotify's real window
# class is SpotifyMainWindow, so the wildcard is what makes this rule fire.
[[rules]]
match_class = "*Spotify*"
floating = true

[[keybinds]]
keys = "Alt+Shift+R"
action = "retile"
description = "Retile windows"

[[keybinds]]
keys = "Alt+Shift+T"
action = "toggle_tiling"
description = "Toggle tiling"

[[keybinds]]
keys = "Alt+Shift+Space"
action = "command_center"
description = "Open the AltDWM command center"

[[keybinds]]
keys = "Alt+Shift+Q"
action = "quit"
description = "Quit AltDWM"

[[keybinds]]
keys = "Alt+Shift+G"
action = 'set_layout("Grid")'
description = "Grid layout"

[[keybinds]]
keys = "Alt+Shift+M"
action = 'set_layout("Monocle")'

[[keybinds]]
keys = "Alt+Shift+F"
action = 'set_layout("Floating")'

[[keybinds]]
keys = "Alt+Shift+S"
action = 'set_layout("MasterStack")'

[[keybinds]]
keys = "Alt+Shift+C"
action = "reload_config"
description = "Hot-reload config"

[[keybinds]]
keys = "Alt+Shift+J"
action = "focus_next()"
description = "Focus next window"

[[keybinds]]
keys = "Alt+Shift+K"
action = "focus_prev()"
description = "Focus prev window"

[[keybinds]]
keys = "Alt+Shift+H"
action = "focus_prev()"
description = "Focus prev (left)"

[[keybinds]]
keys = "Alt+Shift+L"
action = "focus_next()"
description = "Focus next (right)"

[layouts.spiral]
script = "scripts/spiral.rhai"
gap = 8
