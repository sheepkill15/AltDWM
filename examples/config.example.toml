[general]
gap = 8
outer_gap = 0
layout = "MasterStack"
taskbar = true
taskbar_height = 40
auto_tile = true
instant_first_layout = true
auto_float_utility_windows = true
respect_window_size_constraints = true
hide_native_taskbar = true
filter_virtual_desktop = false

[ignore]
classes = [
    "Progman",
    "WorkerW",
    "Shell_TrayWnd",
    "Shell_SecondaryTrayWnd",
    "AltDWM_Taskbar",
    "AltDWM_Host",
]
titles = []
processes = []

[theme]
panel_bg = "#1e1e1e"
panel_bg_top = "#252526"
text = "#ffffff"
text_dim = "#aaaaaa"
accent = "#3a6ea5"
accent_active = "#007acc"
border = "#404040"
border_active = "#8b5cf6"
border_inactive = "#343842"
tray_bg = "#2d2d30"
surface = "#292b32"
surface_hover = "#353842"
font_name = "Segoe UI"
font_size = 13
rounding = 12
gap = 8

[[panels]]
name = "shell"
position = "bottom"
height = 58
monitor = "all"
margin = [0, 8, 8, 8]
widgets = [
    "launcher",
    "workspaces",
    "layout",
    "window_list",
    "cpu",
    "input",
    "volume",
    "network",
    "tray",
    "clock",
]

[[widgets]]
type = "launcher"
name = "launcher"
label = "AltDWM"
width = 120

[[widgets]]
type = "layout"
name = "layout"
width = 216

[[widgets]]
type = "window_list"
name = "window_list"

[[widgets]]
type = "window_title"
name = "window_title"

[[widgets]]
type = "tray"
name = "tray"
width = 180

[[widgets]]
type = "clock"
name = "clock"
format = "%H:%M"
interval = 1000
width = 136

[[widgets]]
type = "custom"
name = "cpu"
interval = 2000
script = "scripts/cpu.rhai"
width = 150

# match_class is exact; `*` opts into partial matching. Spotify's real window
# class is SpotifyMainWindow, so the wildcard is what makes this rule fire.
[[rules]]
match_class = "*Spotify*"
floating = true

[[rules]]
match_process = "steamwebhelper.exe"
match_title_regex = "(?i)(friends list|steam chat|friends & chat)"
floating = true

[[keybinds]]
keys = "Alt+Shift+R"
action = "retile"
description = "Retile windows"

[[keybinds]]
keys = "Alt+Shift+T"
action = "toggle_tiling"
description = "Toggle tiling"

[[keybinds]]
keys = "Alt+Shift+Space"
action = "command_center"
description = "Open the AltDWM command center"

[[keybinds]]
keys = "Alt+Shift+Q"
action = "quit"
description = "Quit AltDWM"

[[keybinds]]
keys = "Alt+Shift+G"
action = 'set_layout("Grid")'
description = "Grid layout"

[[keybinds]]
keys = "Alt+Shift+M"
action = 'set_layout("Monocle")'

[[keybinds]]
keys = "Alt+Shift+F"
action = 'set_layout("Floating")'

[[keybinds]]
keys = "Alt+Shift+S"
action = 'set_layout("MasterStack")'

[[keybinds]]
keys = "Alt+Shift+C"
action = "reload_config"
description = "Hot-reload config"

[[keybinds]]
keys = "Alt+Shift+J"
action = "focus_next()"
description = "Focus next window"

[[keybinds]]
keys = "Alt+Shift+K"
action = "focus_prev()"
description = "Focus prev window"

[[keybinds]]
keys = "Alt+Shift+H"
action = "focus_prev()"
description = "Focus prev (left)"

[[keybinds]]
keys = "Alt+Shift+L"
action = "focus_next()"
description = "Focus next (right)"

[layouts.spiral]
script = "scripts/spiral.rhai"
gap = 8
