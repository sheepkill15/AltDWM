[general]
gap = 8
layout = "MasterStack"
taskbar = true
taskbar_height = 40
auto_tile = true
filter_virtual_desktop = false

[ignore]
classes = [
    "Progman",
    "WorkerW",
    "Shell_TrayWnd",
    "Shell_SecondaryTrayWnd",
    "AltDWM_Taskbar",
    "AltDWM_Host",
]
titles = []
processes = []

[[panels]]
name = "bottom"
position = "bottom"
height = 40
monitor = "all"
background = "#202020"
widgets = [
    "workspaces",
    "window_title",
    "spacer",
    "tray",
    "clock",
]

[[panels]]
name = "top"
position = "top"
height = 28
monitor = "primary"
background = "#1a1a1a"
widgets = [
    "launcher",
    "spacer",
    "cpu",
]

[[widgets]]
type = "workspaces"
name = "workspaces"

[[widgets]]
type = "window_title"
name = "window_title"

[[widgets]]
type = "tray"
name = "tray"
width = 200

[[widgets]]
type = "clock"
name = "clock"
format = "%H:%M:%S"
interval = 1000
action = 'rhai: launch("explorer.exe")'
width = 160

[[widgets]]
type = "spacer"
name = "spacer"

[[widgets]]
type = "launcher"
name = "launcher"
action = "launch('explorer.exe')"
label = "Menu"
width = 40
tooltip = "Launcher"

[[widgets]]
type = "custom"
name = "cpu"
interval = 2000
script = "scripts/cpu.rhai"
width = 120

[[rules]]
match_class = "Spotify"
floating = true

[[keybinds]]
keys = "Alt+Shift+R"
action = "retile"
description = "Retile windows"

[[keybinds]]
keys = "Alt+Shift+T"
action = "toggle_tiling"
description = "Toggle tiling"

[[keybinds]]
keys = "Alt+Shift+Q"
action = "quit"
description = "Quit AltDWM"

[[keybinds]]
keys = "Alt+Shift+G"
action = 'set_layout("Grid")'
description = "Grid layout"

[[keybinds]]
keys = "Alt+Shift+M"
action = 'set_layout("Monocle")'

[[keybinds]]
keys = "Alt+Shift+F"
action = 'set_layout("Floating")'

[[keybinds]]
keys = "Alt+Shift+S"
action = 'set_layout("MasterStack")'

[[keybinds]]
keys = "Alt+Shift+C"
action = "reload_config"
description = "Hot-reload config"

[layouts]
