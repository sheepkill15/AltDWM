# AltDWM example config — copy to %APPDATA%/AltDWM/config.toml or ./config.toml
# Run: alt-dwm --generate-config  (will overwrite docs copy)
# Hot reload: Win+Shift+C

[general]
gap = 8
layout = "MasterStack"   # MasterStack | Grid | Monocle | Floating
taskbar = true           # legacy shim -> creates a single bottom panel
taskbar_height = 40
auto_tile = true

[ignore]
classes = ["Progman", "WorkerW", "Shell_TrayWnd", "Shell_SecondaryTrayWnd", "AltDWM_Taskbar", "AltDWM_Host"]
titles = []
processes = []

