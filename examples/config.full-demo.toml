# RustRover full-demo configuration. This exercises the complete panel/widget,
# scripting, layout, rule, hotkey, multi-monitor, and virtual-desktop paths.
[general]
desktop = true
gap = 4
outer_gap = 4
layout = "spiral"
taskbar = true
taskbar_height = 40
auto_tile = true
instant_first_layout = true
auto_float_utility_windows = true
respect_window_size_constraints = true
hide_native_taskbar = true
# Where notification-area icons come from.
#   auto     - host the notification area when AltDWM owns the taskbar (the case
#              above), mirror Explorer's tray when it does not
#   native   - always host it; icons arrive here instead of in Explorer's tray
#   explorer - always mirror Explorer's buttons over UI Automation (no icons,
#              only names)
#   off      - show nothing
tray = "auto"
launch_startup_apps = true # only runs when AltDWM is the configured Winlogon shell
filter_virtual_desktop = false
# Workspaces hide the windows that are not on the visible one. Opt-in, because
# `1` (the default) keeps the feature inert. If AltDWM is ever killed outright
# while windows are hidden, `alt-dwm --restore-windows` brings them back.
workspaces = 4        # per monitor
master_ratio = 0.6    # master column's share of the usable width

[ignore]
classes = [
    "Progman",
    "WorkerW",
    "Shell_TrayWnd",
    "Shell_SecondaryTrayWnd",
    "AltDWM_Taskbar",
    "AltDWM_Host",
    "AltDWM_Panel",
]
titles = []
processes = []

[theme]
panel_bg = "#17191f"
panel_bg_top = "#20242d"
text = "#f4f6fb"
text_dim = "#9aa4b5"
accent = "#8b5cf6"
accent_active = "#a78bfa"
border = "#4c3f73"
border_active = "#a78bfa"
border_inactive = "#353b49"
tray_bg = "#272b35"
surface = "#292d38"
surface_hover = "#353b49"
font_name = "Segoe UI"
font_size = 13
font_weight = 400
strong_font_weight = 500
rounding = 12
gap = 4

# One coherent shell bar per display. The primary controls are deliberately
# discoverable instead of split across developer-demo panels.
[[panels]]
name = "shell"
position = "top"
height = 40
monitor = "all"
margin = [0, 8, 8, 8]
widgets = [
    "launcher",
    "workspaces",
    "layout",
    "window_list",
    "cpu",
    "system",
    "tray",
    "power_menu",
    "clock",
]

[[widgets]]
type = "launcher"
name = "launcher"
script = "scripts/widgets/launcher.rhai"
label = "AltDWM"
width = 120

[[widgets]]
type = "workspaces"
name = "workspaces"
script = "scripts/widgets/workspaces.rhai"
# Width is derived from the workspace count when omitted.

[[widgets]]
type = "layout"
name = "layout"
script = "scripts/widgets/layout.rhai"
width = 180

[[widgets]]
type = "window_list"
name = "window_list"
script = "scripts/widgets/window_list.rhai"

[[widgets]]
type = "tray"
name = "tray"
script = "scripts/widgets/tray.rhai"
# Omit `width` and the tray sizes itself to its icons; set it to pin the bar's
# geometry. `max_items` caps how many reach the bar — the rest go to the
# overflow button.
# width = 176
# max_items = 3 # default

[[widgets]]
type = "power_menu"
name = "power_menu"
script = "scripts/widgets/power_menu.rhai"
# show_label = true
# label = "Power"

[[widgets]]
type = "clock"
name = "clock"
script = "scripts/widgets/clock.rhai"
format = "%H:%M"
interval = 500
width = 136

# One configurable system cluster. Click opens quick settings anchored below
# this top panel; scrolling changes volume. Disable any part independently.
[[widgets]]
type = "system_status"
name = "system"
script = "scripts/widgets/system.rhai"
show_volume = true
show_network = true
show_battery = true
show_input = true

[[widgets]]
type = "custom"
name = "cpu"
interval = 1000
script = "scripts/cpu.rhai"
width = 150

# Demonstrates class matching, floating rules, opacity, and on-create Rhai.
# A regex matches anywhere by default; `match_class = "*Spotify*"` is equivalent.
[[rules]]
match_class_regex = "(?i)spotify"
floating = true
opacity = 0.94
on_create = 'rhai: log("Spotify matched the full-demo rule")'

[[keybinds]]
keys = "Alt+Shift+R"
action = "retile"
description = "Retile windows"

[[keybinds]]
keys = "Alt+Shift+T"
action = "toggle_tiling"
description = "Toggle tiling"

[[keybinds]]
keys = "Alt+Shift+Space"
action = "command_center"
description = "Open the AltDWM command center"

[[keybinds]]
keys = "Alt+Shift+Q"
action = "quit"
description = "Quit AltDWM"

[[keybinds]]
keys = "Alt+Shift+G"
action = 'set_layout("Grid")'
description = "Grid layout"

[[keybinds]]
keys = "Alt+Shift+M"
action = 'set_layout("Monocle")'
description = "Monocle layout"

[[keybinds]]
keys = "Alt+Shift+F"
action = 'set_layout("Floating")'
description = "Floating layout"

[[keybinds]]
keys = "Alt+Shift+S"
action = 'set_layout("spiral")'
description = "Rhai custom layout"

[[keybinds]]
keys = "Alt+Shift+A"
action = "quick_settings"
description = "Open quick settings"

[[keybinds]]
keys = "Alt+Shift+I"
action = "cycle_input"
description = "Cycle keyboard layout"

[[keybinds]]
keys = "Alt+Shift+Up"
action = "volume_up"
description = "Volume up"

[[keybinds]]
keys = "Alt+Shift+Down"
action = "volume_down"
description = "Volume down"

[[keybinds]]
keys = "Alt+Shift+0"
action = "toggle_mute"
description = "Toggle mute"

[[keybinds]]
keys = "Alt+Shift+C"
action = "reload_config"
description = "Hot-reload this config"

[[keybinds]]
keys = "Alt+Shift+J"
action = 'focus_direction("down")'
description = "Focus the window below"

[[keybinds]]
keys = "Alt+Shift+K"
action = 'focus_direction("up")'
description = "Focus the window above"

[[keybinds]]
keys = "Alt+Shift+H"
action = 'focus_direction("left")'
description = "Focus the window to the left"

[[keybinds]]
keys = "Alt+Shift+L"
action = 'focus_direction("right")'
description = "Focus the window to the right"

# Move the focused window through the layout without the mouse.
[[keybinds]]
keys = "Ctrl+Alt+Shift+H"
action = 'move_window("left")'
description = "Move window left in the layout"

[[keybinds]]
keys = "Ctrl+Alt+Shift+L"
action = 'move_window("right")'
description = "Move window right in the layout"

[[keybinds]]
keys = "Ctrl+Alt+Shift+J"
action = 'move_window("down")'
description = "Move window down in the layout"

[[keybinds]]
keys = "Ctrl+Alt+Shift+K"
action = 'move_window("up")'
description = "Move window up in the layout"

[[keybinds]]
keys = "Alt+Shift+Return"
action = "promote"
description = "Make the focused window master"

[[keybinds]]
keys = "Alt+Shift+."
action = "wider_master"
description = "Widen the master column"

[[keybinds]]
keys = "Alt+Shift+,"
action = "narrower_master"
description = "Narrow the master column"

# Workspaces, per monitor.
[[keybinds]]
keys = "Alt+Shift+1"
action = "workspace(1)"
description = "Show workspace 1"

[[keybinds]]
keys = "Alt+Shift+2"
action = "workspace(2)"
description = "Show workspace 2"

[[keybinds]]
keys = "Alt+Shift+3"
action = "workspace(3)"
description = "Show workspace 3"

[[keybinds]]
keys = "Alt+Shift+4"
action = "workspace(4)"
description = "Show workspace 4"

[[keybinds]]
keys = "Ctrl+Alt+Shift+1"
action = "send_to_workspace(1)"
description = "Send window to workspace 1 and follow"

[[keybinds]]
keys = "Ctrl+Alt+Shift+2"
action = "send_to_workspace(2)"
description = "Send window to workspace 2 and follow"

[[keybinds]]
keys = "Ctrl+Alt+Shift+3"
action = "send_to_workspace(3)"
description = "Send window to workspace 3 and follow"

[[keybinds]]
keys = "Ctrl+Alt+Shift+4"
action = "send_to_workspace(4)"
description = "Send window to workspace 4 and follow"

[[keybinds]]
keys = "Alt+Shift+Tab"
action = "next_workspace"
description = "Next workspace"

[[keybinds]]
keys = "Alt+Shift+Y"
action = "toggle_floating()"
description = "Toggle focused window floating"

[[keybinds]]
keys = "Alt+Shift+N"
action = "move_to_next_monitor()"
description = "Move focused window to next monitor"

[[keybinds]]
keys = "Alt+Shift+P"
action = "move_to_prev_monitor()"
description = "Move focused window to previous monitor"

[layouts.spiral]
script = "scripts/spiral.rhai"
gap = 4

