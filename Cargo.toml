[package]
name = "alt-dwm"
version = "0.3.0"
edition = "2021"
description = "AltDWM - Experimental Windows 11 shell / window manager replacement (Rust)"
authors = ["AltDWM"]
license = "MIT"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "1"
dirs = "6"
rhai = { version = "1.22", features = ["sync"] }
regex = "1.11"
notify = "8"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
